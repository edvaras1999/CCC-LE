name: Build Skyrim LE plugin

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out CCC LE
        uses: actions/checkout@v4

      - name: Check out SKSE 1.7.3 headers
        uses: actions/checkout@v4
        with:
          repository: Amelinyaa/SKSE
          ref: f22a633d632dc254edfe745b9348088eb8efa962
          path: work/skse-source

      - name: Configure Win32 build
        run: >-
          cmake -S . -B build -A Win32
          -DSKSE_LE_ROOT="${{ github.workspace }}/work/skse-source/src"

      - name: Build plugin
        run: cmake --build build --config Release --parallel

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: CinematicConversationCamera-LE
          path: build/Release/CinematicConversationCamera.dll
